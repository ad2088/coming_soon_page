<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eeeae2" />
    <meta name="description" content="Something good is on the horizon. Our new website is coming soon. Thank you for being here." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Something good is coming." />
    <meta property="og:description" content="A new website is taking shape. We look forward to sharing it with you." />
    <meta property="og:locale" content="en_US" />
    <title>Something good is coming.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/scene.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div class="wordmark" aria-label="A new beginning">
          <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M16 2v28M2 16h28M6.1 6.1l19.8 19.8M6.1 25.9 25.9 6.1" stroke="currentColor" stroke-width="2.5" />
          </svg>
          <span>A new beginning.</span>
        </div>
        <p class="availability"><span class="status-dot" aria-hidden="true"></span>Website in the works</p>
      </header>

      <main>
        <div class="hero-copy">
          <h1>Good things<br />are on the<br /><em>horizon.</em></h1>
          <p class="intro">A new website is taking shape.<br class="desktop-break" /> We can’t wait to share it with you.</p>
        </div>

        <div class="sculpture">
          <canvas id="scene" aria-hidden="true"></canvas>
          <div class="sculpture-shadow" aria-hidden="true"></div>
          <div class="horizon-art" aria-hidden="true">
          <div class="orbit orbit-outer"></div>
          <div class="orbit orbit-middle"></div>
          <div class="orbit orbit-inner"></div>
          <div class="sun"></div>
          <div class="horizon-line"></div>
          <div class="reflection">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <span class="little-sun"></span>
          </div>
          <button class="motion-toggle" type="button" hidden aria-label="Pause animation">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M5 3v10M11 3v10" stroke="currentColor" stroke-width="2"/></svg>
            <span>Pause animation</span>
          </button>
        </div>

        <div class="launch-note">
          <span class="note-rule" aria-hidden="true"></span>
          <p>A little patience.<br /><strong>A whole new perspective.</strong></p>
        </div>
      </main>

      <footer class="footer">
        <p class="coming-soon">Coming soon<span aria-hidden="true"> ↗</span></p>
        <p>Thanks for being here.<br /><span>It’s just the beginning.</span></p>
      </footer>
    </div>
  </body>
</html>
